name: Sync Readme

on:
  push:
    paths:
      - 'turtle_runaway.md'

# 깃허브 액션 봇에게 저장소 쓰기 권한을 명시적으로 부여합니다
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy file to README.md
        run: cp turtle_runaway.md README.md

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add README.md
          git commit -m "docs: Sync turtle_runaway.md to README.md" || exit 0
          git push
